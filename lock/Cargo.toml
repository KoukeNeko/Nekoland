[package]
name = "nekoland-lock"
version = "0.1.0"
edition = "2021"
description = "Nekoland's screen lock: the wallpaper under ink, the time, and a field for the password"

[dependencies]
cairo-rs = { version = "0.20", features = ["png"] }
gdk-pixbuf = "0.20"
# For time zones by name, as the second clock has.
glib = { version = "0.20", features = ["v2_68"] }
libc = "0.2"
pango = "0.20"
pangocairo = "0.20"
smithay-client-toolkit = "0.19"
toml = "0.8"
wayland-client = "0.31"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
