[package]
name = "nekoland"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
bitflags = "2.2.1"
cairo-rs = { version = "0.20", features = ["png"] }
gdk-pixbuf = "0.20"
gio = "0.20"
libc = "0.2"
nekoland-calendar-data = { path = "calendar-data" }
nekoland-shortcuts = { path = "shortcuts" }
pango = { version = "0.20", features = ["v1_44"] }
pangocairo = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-drm-extras = { version = "0.1.0", default-features = false }
toml = "0.8"
tracing = "0.1"
wayland-backend = "0.3"
wayland-protocols-plasma = { version = "0.3", features = ["server"] }
wayland-scanner = "0.31"
wayland-server = "0.31"
xcursor = "0.3"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "wayland_frontend",
    "xwayland",
    "desktop",
]

[workspace]
members = ["ui", "menus", "lock", "calendar-data", "shortcuts"]
exclude = ["third_party"]

# Smithay 0.7.0 with its DRM compositor's damage clips turned with the output: upstream
# reports a rotated output's damage unturned, and displays that update only what is
# damaged, as virtual machines' and panels with self refresh, then show part of the frame.
# Drop this once a release fixes it.
[patch.crates-io]
smithay = { path = "third_party/smithay" }
