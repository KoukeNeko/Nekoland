[package]
name = "nekoland"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
bitflags = "2.2.1"
cairo-rs = { version = "0.20", features = ["png"] }
pango = "0.20"
pangocairo = "0.20"
serde = { version = "1", features = ["derive"] }
smithay-drm-extras = { version = "0.1.0", default-features = false }
toml = "0.8"
tracing = "0.1"
xcursor = "0.3"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "wayland_frontend",
    "xwayland",
    "desktop",
]
