[package]
name = "nekoland-ui"
version = "0.1.0"
edition = "2021"
description = "Nekoland's own windows: widgets in Slint and a window that shows them all, and the settings, a calendar, the App Store and the file chooser in GTK"

[[bin]]
name = "nekoland-gallery"
path = "src/main.rs"

[[bin]]
name = "nekoland-confirm"
path = "src/confirm.rs"

[[bin]]
name = "nekoland-launcher"
path = "src/launcher.rs"

[[bin]]
name = "nekoland-settings"
path = "src/settings.rs"

[[bin]]
name = "nekoland-calendar"
path = "src/calendar.rs"

[[bin]]
name = "nekoland-store"
path = "src/store.rs"

[[bin]]
name = "nekoland-askpass"
path = "src/askpass.rs"

[[bin]]
name = "nekoland-filechooser"
path = "src/filechooser.rs"

[[bin]]
name = "nekoland-fileop"
path = "src/fileop.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
serde_json = "1"
slint = "1.18"
toml = "0.8"

[build-dependencies]
slint-build = "1.18"
