[package]
name = "nekoland-ui"
version = "0.1.0"
edition = "2021"
description = "Nekoland's own windows: widgets in Slint and a window that shows them all, and the settings, a calendar, Market, the file chooser, the file manager, the task manager and the disk usage in GTK"

[[bin]]
name = "nekoland-gallery"
path = "src/main.rs"

[[bin]]
name = "nekoland-confirm"
path = "src/confirm.rs"

[[bin]]
name = "nekoland-launcher"
path = "src/launcher.rs"

[[bin]]
name = "nekoland-settings"
path = "src/settings.rs"

[[bin]]
name = "nekoland-calendar"
path = "src/calendar.rs"

[[bin]]
name = "nekoland-store"
path = "src/store.rs"

[[bin]]
name = "nekoland-askpass"
path = "src/askpass.rs"

[[bin]]
name = "nekoland-filechooser"
path = "src/filechooser.rs"

[[bin]]
name = "nekoland-fileop"
path = "src/fileop.rs"

[[bin]]
name = "nekoland-files"
path = "src/files.rs"

[[bin]]
name = "nekoland-tasks"
path = "src/tasks.rs"

[[bin]]
name = "nekoland-disk"
path = "src/disk.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
flate2 = "1"
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
libc = "0.2"
nekoland-calendar-data = { path = "../calendar-data" }
pangocairo = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.18"
toml = "0.8"
xcursor = "0.3"

[build-dependencies]
slint-build = "1.18"
