[package]
name = "nekoland-ui"
version = "0.1.0"
edition = "2021"
description = "Nekoland's own windows: widgets in Slint and a window that shows them all, and the settings, a calendar, Market, the file chooser, the file manager, the task manager, the disk usage, the disks and the terminal in GTK"

[[bin]]
name = "nekoland-gallery"
path = "src/main.rs"

[[bin]]
name = "nekoland-confirm"
path = "src/confirm.rs"

[[bin]]
name = "nekoland-launcher"
path = "src/launcher.rs"

[[bin]]
name = "nekoland-settings"
path = "src/settings.rs"

[[bin]]
name = "nekoland-calendar"
path = "src/calendar.rs"

[[bin]]
name = "nekoland-store"
path = "src/store.rs"

[[bin]]
name = "nekoland-askpass"
path = "src/askpass.rs"

[[bin]]
name = "nekoland-keyring-prompt"
path = "src/keyring_prompt.rs"

[[bin]]
name = "nekoland-filechooser"
path = "src/filechooser.rs"

[[bin]]
name = "nekoland-fileop"
path = "src/fileop.rs"

[[bin]]
name = "nekoland-files"
path = "src/files.rs"

[[bin]]
name = "nekoland-tasks"
path = "src/tasks.rs"

[[bin]]
name = "nekoland-disk"
path = "src/disk.rs"

[[bin]]
name = "nekoland-disks"
path = "src/disks.rs"

[[bin]]
name = "nekoland-preview"
path = "src/preview.rs"

[[bin]]
name = "nekoland-shot"
path = "src/shot.rs"

[[bin]]
name = "nekoland-terminal"
path = "src/terminal.rs"

[[bin]]
name = "nekoland-security"
path = "src/security.rs"

[[bin]]
name = "nekoland-keyboard"
path = "src/keyboard.rs"

[dependencies]
aes = "0.8"
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
async-channel = "2"
cairo-rs = { version = "0.20", features = ["pdf"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
flate2 = "1"
getrandom = "0.3"
hkdf = "0.12"
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
libc = "0.2"
nekoland-calendar-data = { path = "../calendar-data" }
nekoland-shortcuts = { path = "../shortcuts" }
num-bigint = "0.4"
pangocairo = "0.20"
poppler-rs = "0.24"
png = "0.18"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1.18"
toml = "0.8"
unicode-width = "0.2"
vte4 = { version = "0.8", features = ["v0_76"] }
xcursor = "0.3"

[build-dependencies]
slint-build = "1.18"
