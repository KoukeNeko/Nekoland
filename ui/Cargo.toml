[package]
name = "nekoland-ui"
version = "0.1.0"
edition = "2021"
description = "Nekoland's own windows: widgets in Slint and a window that shows them all, and the settings and a calendar in GTK"

[[bin]]
name = "nekoland-gallery"
path = "src/main.rs"

[[bin]]
name = "nekoland-confirm"
path = "src/confirm.rs"

[[bin]]
name = "nekoland-launcher"
path = "src/launcher.rs"

[[bin]]
name = "nekoland-settings"
path = "src/settings.rs"

[[bin]]
name = "nekoland-calendar"
path = "src/calendar.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
serde_json = "1"
slint = "1.18"
toml = "0.8"

[build-dependencies]
slint-build = "1.18"
