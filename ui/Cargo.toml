[package]
name = "nekoland-ui"
version = "0.1.0"
edition = "2021"
description = "Nekoland's own widgets, in Slint, and a window that shows them all"

[[bin]]
name = "nekoland-gallery"
path = "src/main.rs"

[[bin]]
name = "nekoland-confirm"
path = "src/confirm.rs"

[[bin]]
name = "nekoland-launcher"
path = "src/launcher.rs"

[[bin]]
name = "nekoland-settings"
path = "src/settings.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
slint = { version = "1.18", features = ["unstable-winit-030"] }
toml = "0.8"

[build-dependencies]
slint-build = "1.18"
