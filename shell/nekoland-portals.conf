# Copy to ~/.config/xdg-desktop-portal/nekoland-portals.conf: which portal
# backends a Nekoland session uses. GTK's answers dark or light from GSettings;
# xdg-desktop-portal-wlr takes screenshots and shares the screen through
# Nekoland's wlr-screencopy, the display chosen in nekoland-screenshare;
# Nekoland's own file chooser opens and saves files.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.FileChooser=nekoland
