# An example ~/.config/nekoland/config.toml. The menu bar, the Dock, notifications and
# the launcher are Nekoland's own; this adds a wallpaper and an input method.

autostart = [
    "swaybg -m fill -i /usr/share/backgrounds/warty-final-ubuntu.png",
    # The input method; its keyboard grab and candidate popups go through Wayland.
    "fcitx5 -d --replace",
]
terminal = "foot"
dock = ["org.gnome.Nautilus", "org.gnome.TextEditor", "org.gnome.Calculator", "foot"]
