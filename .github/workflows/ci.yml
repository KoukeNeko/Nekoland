name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # The Ubuntu Nekoland is made on and install.sh is tried on.
    container: ubuntu:26.10
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        # install.sh's build packages, read from it so that the two cannot drift apart;
        # Ubuntu Sans, which a test sets text in; rsync, which the backup's test runs; and the
        # partitioning tools the disk manager's test runs on an image file.
        run: |
          packages=$(sed -n '/^build_packages="/,/"$/p' install.sh | sed 's/^build_packages=//; s/"//g')
          apt-get update -q
          apt-get install -y -q --no-install-recommends $packages fonts-ubuntu rsync parted e2fsprogs zstd

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build as install.sh does
        run: |
          cargo build --release --locked --workspace
          sh shell/build-shellmenu.sh target/release

      - name: Package
        # What install.sh installs from target/release, named for this Ubuntu and processor,
        # with the commit it was built from: install.sh takes it only for that commit.
        run: |
          . /etc/os-release
          name=nekoland-ubuntu-$VERSION_ID-$(dpkg --print-architecture).tar.gz
          mkdir -p package/release
          for program in target/release/nekoland target/release/nekoland-*; do
            case $program in *.d) continue ;; esac
            cp "$program" package/release/
          done
          cp target/release/libnekoland_menus.so package/release/
          echo "$GITHUB_SHA" > package/COMMIT
          tar -czf "$name" -C package release COMMIT
          sha256sum "$name" > "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.runner }}
          path: nekoland-ubuntu-*.tar.gz*
          retention-days: 3

  publish:
    # One release, replaced by each build of main, for install.sh to download from.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: publish
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        run: |
          gh release delete continuous --cleanup-tag --yes || true
          gh release create continuous --target "$GITHUB_SHA" --prerelease \
            --title "Latest build of main" \
            --notes "Built by CI from $GITHUB_SHA. install.sh downloads these." \
            nekoland-ubuntu-*.tar.gz*
