name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        # The Ubuntu Nekoland is made and tested on, and Debian, which unkernel's guest
        # runs, built for install.sh to download.
        system: [ubuntu, debian]
        include:
          - system: ubuntu
            image: ubuntu:26.10
          - system: debian
            image: debian:13
    runs-on: ${{ matrix.runner }}
    # Unconfined, as on a computer: under Docker's AppArmor profile, writing a
    # datagram to an abstract socket, as Plaitway's systemd notification test does,
    # blocks for good.
    container:
      image: ${{ matrix.image }}
      options: --security-opt apparmor=unconfined
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        # install.sh's build packages, read from it so that the two cannot drift apart;
        # Ubuntu Sans, which a test sets text in; rsync, which the backup's test runs; and the
        # partitioning tools the disk manager's test runs on an image file.
        run: |
          packages=$(sed -n '/^build_packages="/,/"$/p' install.sh | sed 's/^build_packages=//; s/"//g')
          apt-get update -q
          [ "${{ matrix.system }}" != ubuntu ] || packages="$packages fonts-ubuntu rsync parted e2fsprogs zstd"
          apt-get install -y -q --no-install-recommends $packages

      - name: Install Rust
        # Debian's is older than Cargo.toml's rust-version, as install.sh finds too.
        if: matrix.system == 'debian'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Test
        if: matrix.system == 'ubuntu'
        run: |
          cargo test --workspace --locked
          (cd third_party/plaitway && go test ./...)

      - name: Build as install.sh does
        run: |
          cargo build --release --locked --workspace
          sh shell/build-shellmenu.sh target/release
          sh shell/build-vpn.sh target/release

      - name: Package
        # What install.sh installs from target/release, named for this system and processor,
        # with the commit it was built from: install.sh takes it only for that commit.
        run: |
          . /etc/os-release
          name=nekoland-$ID-$VERSION_ID-$(dpkg --print-architecture).tar.gz
          mkdir -p package/release
          for program in target/release/nekoland target/release/nekoland-*; do
            case $program in *.d) continue ;; esac
            cp "$program" package/release/
          done
          cp target/release/libnekoland_menus.so package/release/
          echo "$GITHUB_SHA" > package/COMMIT
          tar -czf "$name" -C package release COMMIT
          sha256sum "$name" > "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.system }}-${{ matrix.runner }}
          path: nekoland-*.tar.gz*
          retention-days: 3

  publish:
    # One release, replaced by each build of main, for install.sh to download from.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: publish
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        run: |
          gh release delete continuous --cleanup-tag --yes || true
          gh release create continuous --target "$GITHUB_SHA" --prerelease \
            --title "Latest build of main" \
            --notes "Built by CI from $GITHUB_SHA. install.sh downloads these." \
            nekoland-*.tar.gz*
