name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The Ubuntu Nekoland is made on and install.sh is tried on.
    container: ubuntu:26.10
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        # install.sh's build packages, read from it so that the two cannot drift apart, and
        # Ubuntu Sans, which a test sets text in.
        run: |
          packages=$(sed -n '/^build_packages="/,/"$/p' install.sh | sed 's/^build_packages=//; s/"//g')
          apt-get update -q
          apt-get install -y -q --no-install-recommends $packages fonts-ubuntu

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build as install.sh does
        run: cargo build --release --locked --workspace
